{% extends "base.html" %}

{% block title %}Add Logbook Entry · WIL Placement System{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="mb-4">
        <h1 class="h3">Add Logbook Entry</h1>
        <p class="text-body-secondary">
            {{ placement.student }} · {{ placement.organisation.organisation_name }}
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        Save Entry
                    </button>

                    <a href="{% url 'logbook:placement_entries' placement.pk %}"
                       class="btn btn-outline-secondary ms-2">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
