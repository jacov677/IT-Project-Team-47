{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h1 class="text-primary mb-3">Post Placement Opportunity</h1>

    <div class="card shadow-sm p-4">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Save Opportunity</button>
        </form>
    </div>

    <div class="mt-3">
        <a href="{% url 'org_dashboard' %}" class="text-decoration-none">&larr; Back to Dashboard</a>
    </div>
</div>
{% endblock %}
