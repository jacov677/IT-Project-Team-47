{% extends 'base.html' %}

{% block title %}Post Placement Opportunity{% endblock %}

{% block content %}
<style>
  /* Make Django's form.as_p look like Bootstrap */
  form p label { font-weight: 600; margin-bottom: .25rem; display: block; }
  form p input, form p select, form p textarea {
    display: block; width: 100%; padding: .375rem .75rem;
    border: 1px solid #dee2e6; border-radius: .375rem;
    background: #fff;
  }
  form p .helptext { font-size: .875rem; color: #6c757d; display: block; }
  form ul.errorlist { color: #dc3545; list-style: none; padding-left: 0; margin-bottom: .5rem; }
</style>

<div class="mx-auto" style="max-width: 600px;">
  <h1 class="text-primary mb-3">Post Placement Opportunity</h1>

  <div class="card shadow-sm p-4">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100 mt-3">Save Opportunity</button>
      <a href="{% url 'organisations:org_dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
