{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WIL Placement System{% endblock %}</title>
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'core:home' %}">WIL Placement System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{% url 'accounts:index' %}">Accounts</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'organisations:index' %}">Organisations</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'placements:index' %}">Placements</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'logbook:index' %}">Logbook</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'assessments:index' %}">Assessments</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'reports:index' %}">Reports</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
