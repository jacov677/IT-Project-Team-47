{% extends "base.html" %}
{% block title %}Log in · WIL Placement System{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>
        {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>{% endif %}
        <form method="post">{% csrf_token %}
          <div class="mb-3"><label class="form-label" for="{{ form.username.id_for_label }}">Email</label>{{ form.username }}</div>
          <div class="mb-3"><label class="form-label" for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
